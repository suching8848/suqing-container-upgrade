name: Validate compatibility registry

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check registry bindings and generated files
        run: python -B SuQingContainerUpgrade/tools/build_compatibility.py --check
